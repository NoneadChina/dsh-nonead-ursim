# dsh-nonead-ursim 插件（DSH Bundle patch）
# 作为 bundle 被合入 profile 时，自动插入本插件行。
# 插件负责启动 Python UR 控制 worker，并把 UR 机器人控制工具注册到 ctx.tools。
- insert:
    - id: nonead-ursim
      name: 'dsh-nonead-ursim'
      config:
        # 用于启动 python/ur_worker.py 的解释器；可改为绝对路径，例如
        # 'C:\\Python312\\python.exe' 或 '/usr/bin/python3'。
        pythonBin: 'python'
        # 单条运动/脚本命令的执行超时（毫秒）。机器人到位的确认轮询在此上限内。
        commandTimeoutMs: 60000
        # 首次 connect 的超时（毫秒）。
        connectTimeoutMs: 30000
        # 运动/程序类指令是否需人工确认后再下发（true=需确认，fail-closed）。
        requireApprovalForMotion: true
        # 运行模式：'sim'（默认）＝纯离线仿真，真机通道**结构性不可达**；
        # 'real' ＝显式开启的真机通道（见 README 的「真机通道（默认关闭）」一节）。
        motionMode: 'sim'
        # 真机模式下允许操作的机器人地址，逗号分隔（例如 '192.168.1.10,192.168.1.11'）。
        # 留空时**任何真机目标都会被拒**（fail-closed），而不是"谁都能连"。
        realRobotIps: ''
        # 仿真态是否落盘（路线图 E2）。落盘后宿主重启仍能按上次的配置恢复仿真；
        # 用户明确关掉时落盘的是 enabled:false，重启不会把它复活。
        # 文件默认在 <DSH_HOME>/plugin-data/dsh-nonead-ursim/sim-state.json。
        persistSimState: true
        # 仿真态文件路径；留空 = 上面的默认位置。填绝对路径可放到别处（例如共享盘）。
        simStateFile: ''
